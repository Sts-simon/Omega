[package]
name = "omega"
version = "0.38.0"
edition = "2024"
description = "Jeu fictif de conception de véhicules militaires avec Rust et Bevy"
license = "MIT"

[workspace]
members = ["crates/sim-core", "crates/omega-data", "crates/omega-rules"]
resolver = "3"

[dependencies]
omega-data = { path = "crates/omega-data" }
omega-rules = { path = "crates/omega-rules" }
bevy = "=0.20.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
