[package]
name = "aerolab-sim-core"
version = "0.20.0"
edition = "2024"
description = "Bevy-independent numerical simulation core for AEROLAB"
license = "MIT"

[dependencies]
earcutr = "0.5.0"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
